name: Atıf sayılarını güncelle

on:
  schedule:
    - cron: "0 5 * * 1" # Her pazartesi 05:00 UTC (08:00 TR)
  workflow_dispatch: # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Metrikleri çek
        run: node scripts/update-metrics.mjs
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Değiştiyse commit et (Netlify otomatik yayınlar)
        run: |
          if git diff --quiet src/_data/metrics.json; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/_data/metrics.json
          git commit -m "chore: atıf metriklerini güncelle"
          git push
